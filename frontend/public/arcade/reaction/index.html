<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>반응속도 · 숨은 오락실</title>
    <link rel="stylesheet" href="/arcade/common.css" />
    <style>
      .pad {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        width: 100%; min-height: 340px; padding: 24px; border: 0; border-radius: 18px;
        font: inherit; color: #fff; text-align: center; cursor: pointer;
        background: var(--blue); touch-action: manipulation; user-select: none; -webkit-user-select: none;
      }
      .pad b { font-size: 1.7rem; font-weight: 900; letter-spacing: -0.03em; }
      .pad span { font-size: 0.92rem; opacity: 0.85; }
      .pad.wait { background: #DC2626; }
      .pad.go { background: #059669; }
      .pad.early { background: #D97706; }
      .rounds { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
      .rounds i { font-style: normal; font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <main class="wrap narrow">
      <header class="head">
        <a class="back" href="/arcade/">← 오락실</a>
        <h1>반응속도</h1>
        <p>빨강이 초록으로 바뀌는 순간 누릅니다. 다섯 번의 평균이 기록입니다.</p>
      </header>
      <div class="bar">
        <div class="stat"><span>이번 평균</span><b id="avg">–</b></div>
        <div class="stat"><span>최고 평균</span><b id="best">–</b></div>
      </div>
      <button class="pad" id="pad"><b id="pad-title">눌러서 시작</b><span id="pad-text">스페이스로도 됩니다.</span></button>
      <div class="rounds" id="rounds"></div>
    </main>
    <script type="module" src="/arcade/reaction/game.js"></script>
  </body>
</html>
