<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>스네이크 · 숨은 오락실</title>
    <link rel="stylesheet" href="/arcade/common.css" />
  </head>
  <body>
    <main class="wrap narrow">
      <header class="head">
        <a class="back" href="/arcade/">← 오락실</a>
        <h1>스네이크</h1>
        <p>방향키·WASD나 스와이프로 방향을 바꿉니다. 스페이스로 잠시 멈춥니다.</p>
      </header>
      <div class="bar">
        <div class="stat"><span>점수</span><b id="score">0</b></div>
        <div class="stat"><span>최고</span><b id="best">0</b></div>
        <div class="stat"><span>속도</span><b id="speed">1</b></div>
      </div>
      <div class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlay-title">스네이크</h2>
          <p id="overlay-text">금색 먹이는 잠깐만 나타나고 5배 점수를 줍니다.</p>
          <button class="btn primary" id="start">시작</button>
        </div>
      </div>
    </main>
    <script type="module" src="/arcade/snake/game.js"></script>
  </body>
</html>
