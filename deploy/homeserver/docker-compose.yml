# 그램 온프레미스 서버: 화면(nginx) · 백엔드 · PostgreSQL · Cloudflare Tunnel을 노트북 한 대에서 돌린다 (docs/homeserver.md)
#
#   방문자 → Cloudflare(HTTPS) → cloudflared → frontend-prod(nginx) ─┬─ 화면 파일(dist)
#                                                                    └─ /api/ → backend-prod → postgres(cookie_prod)
#   스테이징도 같은 모양: frontend-staging → backend-staging → postgres(cookie_staging)
#
# 바깥(공유기 · 인터넷)에는 어떤 포트도 열지 않는다. 바깥 요청은 cloudflared를 거쳐서만 들어온다.
# 화면 서버만 그램 안 확인용으로 127.0.0.1:8080(운영) · 8081(스테이징)에 붙여 둔다.
# nginx는 X-Forwarded-For를 덧붙이지 않고 그대로 넘기므로 백엔드는 그 마지막 값(Cloudflare가 붙인 실제 접속 IP)을 쓴다.
# 이미지는 deploy.sh가 브랜치별 작업 폴더에서 빌드한다(devcookie-backend:prod · :staging, devcookie-frontend:prod · :staging).
name: devcookie

x-backend: &backend
  restart: unless-stopped
  # RAM 8GB 노트북에서 모두 함께 돌도록 컨테이너마다 메모리를 묶고, JVM 힙은 그 75%까지만 쓴다
  mem_limit: 1g
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    # Kafka가 늦게 떠도 백엔드는 먼저 뜬다(그동안 제보는 요청 안에서 바로 처리한다)
    kafka:
      condition: service_started
  environment: &backend-env
    JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -XX:MaxRAMPercentage=75"
    SLACK_ENABLED: "false"
    TRUST_FORWARDED_FOR: "true"
    SPRING_JPA_SHOW_SQL: "false"
    # 소셜 · 깃허브 로그인 키. 비어 있으면 그 로그인 버튼만 숨겨진다
    OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
    OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
    OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
    FEEDBACK_GITHUB_TOKEN: ${FEEDBACK_GITHUB_TOKEN:-}
    TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
    TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
    PAYMENT_OPEN: ${PAYMENT_OPEN:-false}
    OAUTH_NAVER_CLIENT_ID: ${OAUTH_NAVER_CLIENT_ID:-}
    OAUTH_NAVER_CLIENT_SECRET: ${OAUTH_NAVER_CLIENT_SECRET:-}
    OAUTH_KAKAO_CLIENT_ID: ${OAUTH_KAKAO_CLIENT_ID:-}
    OAUTH_KAKAO_CLIENT_SECRET: ${OAUTH_KAKAO_CLIENT_SECRET:-}
    OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
    OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
    OAUTH_SSAFY_CLIENT_ID: ${OAUTH_SSAFY_CLIENT_ID:-}
    OAUTH_SSAFY_CLIENT_SECRET: ${OAUTH_SSAFY_CLIENT_SECRET:-}
    # 비밀번호 재설정 · 이메일 인증 · 학습 메일(SMTP). MAIL_HOST가 비면 메일 기능만 꺼진다
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM: ${MAIL_FROM:-}
    NEWSLETTER_DAILY_LIMIT: ${NEWSLETTER_DAILY_LIMIT:-400}
    NEWSLETTER_CRON: ${NEWSLETTER_CRON:-0 30 8 * * MON-FRI}
    # 신규 개발자 안내 페이지에 보여 줄 기술 블로그 RSS
    BLOG_RSS_URL: ${BLOG_RSS_URL:-https://cookie.tistory.com/rss}
    BLOG_KEYWORDS: ${BLOG_KEYWORDS:-나의쿠키,홈서버}
    # 접속자 수, 채팅 참여자, 요청 제한은 Redis에(운영과 스테이징은 키 앞머리로 나눈다)
    REDIS_ENABLED: ${REDIS_ENABLED:-true}
    REDIS_HOST: redis
    # 제보 이벤트는 Kafka로(운영과 스테이징은 토픽 이름과 소비자 그룹으로 나눈다)
    KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # 면접 AI와 긴급 오류 알림 요약(Gemini 무료 등급). 비어 있으면 두 기능의 AI 부분만 꺼진다
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    # 모델 이름. 구글이 옛 모델을 내리면 여기만 바꾼다(2026-11 기준 gemini-2.5-flash는 404, gemini-flash-latest는 응답 없음)
    INTERVIEW_GEMINI_MODEL: ${INTERVIEW_GEMINI_MODEL:-gemini-flash-lite-latest}
    ALERT_GEMINI_MODEL: ${ALERT_GEMINI_MODEL:-gemini-flash-lite-latest}
    ALERT_ERROR_THRESHOLD: ${ALERT_ERROR_THRESHOLD:-10}
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/categories"]
    interval: 30s
    timeout: 10s
    start_period: 120s
    retries: 3
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-frontend: &frontend
  restart: unless-stopped
  mem_limit: 64m
  logging: *logging

services:
  # 운영 · 스테이징 DB를 한 서버에 따로 둔다. 데이터는 노트북 디스크(/srv/devcookie/pgdata18)에 남고, backup.sh가 매일 덤프를 뜬다
  # 버전은 옮겨 오는 Neon(18)과 맞춘다(pg_dump는 자기보다 새 서버를 덤프하지 못한다)
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD가 .env에 없습니다}
      PROD_DB_PASSWORD: ${PROD_DB_PASSWORD:?PROD_DB_PASSWORD가 .env에 없습니다}
      STAGING_DB_PASSWORD: ${STAGING_DB_PASSWORD:?STAGING_DB_PASSWORD가 .env에 없습니다}
      TZ: Asia/Seoul
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=384MB", "-c", "max_connections=60", "-c", "timezone=Asia/Seoul"]
    volumes:
      - ./pgdata18:/var/lib/postgresql
      - ./app/deploy/homeserver/postgres-init.sh:/docker-entrypoint-initdb.d/10-cookie.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # 짧게 사는 상태(접속자 수, 요청 제한)만 둔다. 지워져도 되는 값이라 디스크에 남기지 않고, 넘치면 오래된 키부터 지운다
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 96m
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  # 제보 이벤트(KRaft 단일 노드, ZooKeeper 없음). 힙을 256MB로 묶어 8GB 예산 안에 둔다.
  # 처리 못 한 이벤트가 재시작 뒤에도 남도록 데이터는 볼륨에 둔다(7일 보관)
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    mem_limit: 640m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *logging

  backend-prod:
    <<: *backend
    image: devcookie-backend:prod
    environment:
      <<: *backend-env
      APP_BASE_URL: https://mycookie.dev
      DATABASE_URL: postgresql://cookie_prod:${PROD_DB_PASSWORD}@postgres:5432/cookie_prod?sslmode=disable
      ADMIN_KEY: ${PROD_ADMIN_KEY:?PROD_ADMIN_KEY가 .env에 없습니다}
      REDIS_KEY_PREFIX: "prod:"
      KAFKA_TOPIC_PREFIX: prod
      KAFKA_GROUP_ID: cookie-prod
      # Mattermost 장애·제보 운영 알림(운영에만)
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL:-}
      # 긴급 알림에 붙일 Grafana 로그 링크(docs/monitoring.md)
      GRAFANA_URL: ${GRAFANA_URL:-}

  backend-staging:
    <<: *backend
    image: devcookie-backend:staging
    mem_limit: 768m
    environment:
      <<: *backend-env
      APP_BASE_URL: https://staging.mycookie.dev
      OAUTH_ALLOWED_ORIGINS: https://staging.mycookie.dev
      DATABASE_URL: postgresql://cookie_staging:${STAGING_DB_PASSWORD}@postgres:5432/cookie_staging?sslmode=disable
      ADMIN_KEY: ${STAGING_ADMIN_KEY:?STAGING_ADMIN_KEY가 .env에 없습니다}
      REDIS_KEY_PREFIX: "staging:"
      KAFKA_TOPIC_PREFIX: staging
      KAFKA_GROUP_ID: cookie-staging
      # 스테이징에서는 학습 메일을 보내지 않는다
      NEWSLETTER_DAILY_LIMIT: "0"

  frontend-prod:
    <<: *frontend
    image: devcookie-frontend:prod
    environment:
      BACKEND_HOST: backend-prod
    # 그램 안에서만 열리는 확인용 주소(http://localhost:8080). 바깥(공유기 · 인터넷)에서는 접속할 수 없다
    ports: ["127.0.0.1:8080:80"]
    depends_on: [backend-prod]

  frontend-staging:
    <<: *frontend
    image: devcookie-frontend:staging
    environment:
      BACKEND_HOST: backend-staging
      # 스테이징 화면은 검색에 나오지 않게 한다
      ROBOTS_HEADER: "noindex, nofollow"
    ports: ["127.0.0.1:8081:80"]
    depends_on: [backend-staging]

  # 터널의 공개 호스트 이름(mycookie.dev → http://frontend-prod:80 등)은 Cloudflare 대시보드에서 정한다
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - frontend-prod
      - frontend-staging
    logging: *logging

volumes:
  kafka-data:
