spring:
  datasource:
    # PostgreSQL mode omits the BLOB type Hibernate uses for Donation.data in H2.
    url: jdbc:h2:mem:cs_study;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS BLOB AS BYTEA
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
app:
  # 시험은 닉네임 · 비밀번호로 계정을 만들어 쓴다(운영은 소셜 가입만)
  auth:
    password-signup-enabled: true
  security:
    rate-limit-enabled: false
    min-admin-key-length: 0
  duel:
    # 테스트용 정답표. 모든 문제의 정답은 0번 보기다
    bank: classpath:duel-bank-test.json
