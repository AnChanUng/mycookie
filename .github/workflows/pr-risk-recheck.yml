# 승인 · 변경 요청 · 승인 취소가 생기면 PR 위험도 검사("위험도 검사")를 다시 돌린다.
# 리뷰 이벤트로 새 검사를 만들면 푸시 때 실패한 검사가 PR에 그대로 남아 병합이 계속 막힌다.
# 그래서 이 PR의 마지막 커밋에서 돈 위험도 검사 실행(pull_request 이벤트)을 찾아 그대로 다시 실행한다.
# 다시 실행하면 리뷰 목록을 새로 읽으므로 승인이 반영된 결과로 같은 검사가 바뀐다.
# 이 잡 이름은 필수 검사("위험도 검사")와 다르게 둔다. 같은 이름의 건너뜀 · 성공이 승인 없이 검사를 통과시키지 않게 하려는 것이다
name: PR 위험도 재검사

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  actions: write   # 위험도 검사 다시 실행
  contents: read

concurrency:
  group: pr-risk-recheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recheck:
    name: 리뷰 반영 재검사
    # 댓글만 단 리뷰는 판정에 쓰지 않으므로 다시 돌릴 필요가 없다
    if: github.event.action == 'dismissed' || github.event.review.state != 'commented'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: 위험도 검사 다시 실행
        run: |
          # 푸시 직후라 위험도 검사가 아직 돌고 있으면 끝날 때까지 기다린다(최대 약 10분)
          for i in $(seq 1 60); do
            id=""; status=""
            read -r id status < <(gh run list --repo "$REPO" --workflow pr-risk.yml --event pull_request --commit "$SHA" \
              --limit 1 --json databaseId,status --jq '.[0] | "\(.databaseId) \(.status)"' || true) || true
            if [ -z "${id:-}" ] || [ "$id" = null ]; then echo "이 커밋의 위험도 검사 실행을 찾지 못했어요."; exit 0; fi
            [ "$status" = completed ] && break
            echo "위험도 검사 실행($id)이 아직 $status 상태라 기다려요."; sleep 10
          done
          if [ "$status" != completed ]; then echo "::warning::위험도 검사가 끝나지 않아 다시 실행하지 못했어요."; exit 0; fi
          gh run rerun "$id" --repo "$REPO"
          echo "위험도 검사 실행($id)을 다시 돌렸어요: https://github.com/$REPO/actions/runs/$id"
