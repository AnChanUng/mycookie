# PR 규칙 검사: 제목과 브랜치 이름이 규칙(CONTRIBUTING.md)을 따르는지 본다. 유료 API 없이 셸로만 검사한다.
#   제목     "타입: 요약" 또는 "타입(범위): 요약"  예) feat: 버그 제보 양식 개선, fix(exam): 채점 오류
#   브랜치   작업 브랜치는 feature/ fix/ docs/ refactor/ chore/ hotfix/ 로 시작하고 dev로 올린다.
#            master로는 dev만 올린다(위험도 검사도 막는다).
# 제목을 고치면(edited) 다시 돈다. dev, master 브랜치 규칙의 필수 검사로 둔다(.github/rulesets/).
name: PR 규칙

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  convention:
    name: PR 규칙 검사
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TITLE: ${{ github.event.pull_request.title }}
      BASE: ${{ github.event.pull_request.base.ref }}
      HEAD: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: 제목과 브랜치 확인
        run: |
          fail=0
          types='feat|fix|docs|refactor|test|perf|style|ci|build|chore|release|revert'
          if ! printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9-]+\))?!?: .{2,}"; then
            echo "::error::PR 제목은 \"타입: 요약\" 형식이어야 해요. 예) feat: 버그 제보 양식 개선 (타입: ${types//|/, })"
            fail=1
          fi
          case "$BASE" in
            master)
              [ "$HEAD" = dev ] || { echo "::error::master로는 dev만 올릴 수 있어요. 작업 브랜치는 dev로 PR을 올려 주세요."; fail=1; } ;;
            dev)
              case "$HEAD" in
                feature/*|fix/*|docs/*|refactor/*|chore/*|hotfix/*|master) ;;
                *) echo "::error::브랜치 이름은 feature/, fix/, docs/, refactor/, chore/, hotfix/ 중 하나로 시작해야 해요(지금: $HEAD)."; fail=1 ;;
              esac ;;
          esac
          {
            echo "### PR 규칙 검사"
            echo "- 제목: \`$TITLE\`"
            echo "- 브랜치: \`$HEAD\` → \`$BASE\`"
            [ $fail = 0 ] && echo "- 결과: 통과" || echo "- 결과: 규칙에 맞지 않음(위 오류 참고). 제목은 PR 화면에서 바로 고칠 수 있어요."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
