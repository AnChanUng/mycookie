name: Keep backend awake

# Render 무료 서버는 15분 동안 요청이 없으면 잠들고, 깨어나는 데 1~2분이 걸린다.
# 10분마다 가벼운 요청을 보내 잠들지 않게 한다.
# Render 무료 사용 시간은 계정 전체에 월 750시간이다. 24시간 깨우면 운영만으로 약 720시간을 써서
# 스테이징 백엔드를 함께 돌리면 한도를 넘는다. 그래서 한국 시간 08:00~02:00(하루 18시간, 월 약 540시간)에만 깨운다.
# (UTC 23시와 0~16시)
on:
  schedule:
    - cron: "*/10 23,0-16 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sS -m 120 -o /dev/null -w "backend %{http_code} in %{time_total}s\n" \
            https://cs-study-backend-i0ln.onrender.com/api/v1/categories || true
