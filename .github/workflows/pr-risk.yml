# PR 위험도 검사: 바뀐 파일로 위험도를 정하고, 위험도에 맞는 조건을 채웠는지 확인한다.
#   🟢 낮음  문서, 문제 데이터, 테스트만        → CI 통과하면 자동 병합
#   🟡 중간  그 외 백엔드, 화면 코드            → AI 리뷰 통과(또는 사람 승인)하면 자동 병합
#   🔴 높음  보안, 결제, DB 엔티티, 설정, 배포,  → 작성자가 아닌 사람 1명 승인
#           CI, 의존성 / 모든 dev → master        (master는 브랜치 규칙상 관리자만 병합)
# 이 잡("위험도 검사")을 dev, master 브랜치 규칙의 필수 검사로 둔다(.github/rulesets/).
# 승인, 승인 취소가 생기면 다시 돌아 결과를 갱신한다. AI 리뷰는 커밋이 바뀔 때만 다시 한다.
name: PR 위험도

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: write        # 자동 병합
  pull-requests: write   # 라벨, 리뷰 댓글, 자동 병합
  issues: write          # 라벨 만들기

concurrency:
  group: pr-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk:
    name: 위험도 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref }}
      HEAD: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: 위험도 분류
        id: risk
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > files.txt
          level=low; reasons=""
          bump() { # $1=level $2=이유
            case "$1" in high) level=high ;; medium) [ "$level" = low ] && level=medium ;; esac
            reasons="${reasons}- $2"$'\n'
          }
          while IFS= read -r f; do
            case "$f" in
              backend/src/main/java/*/security/*|*Auth*.java|*OAuth*.java|*Password*.java|*Payment*.java|*Toss*.java|*Credential*.java)
                bump high "\`$f\` 로그인, 보안, 결제" ;;
              backend/src/main/java/*/entity/*)
                bump high "\`$f\` DB 엔티티(스키마가 자동으로 바뀜)" ;;
              backend/src/main/resources/application*.yml|backend/build.gradle.kts|backend/Dockerfile|backend/entrypoint.sh)
                bump high "\`$f\` 백엔드 설정, 의존성, 이미지" ;;
              deploy/*|docker-compose.yml|frontend/Dockerfile|frontend/nginx/*|frontend/vercel.json|render.yaml)
                bump high "\`$f\` 배포, 서버 설정" ;;
              .github/*)
                bump high "\`$f\` CI, 저장소 규칙" ;;
              frontend/package.json|frontend/package-lock.json)
                bump high "\`$f\` 화면 의존성" ;;
              *.md|docs/*|content/*|frontend/src/data/*|backend/src/main/resources/content/*|backend/src/main/resources/*-bank.json|backend/src/main/resources/newsletter/*|backend/src/test/*|frontend/public/*)
                ;;  # 낮음
              *)
                bump medium "\`$f\` 코드" ;;
            esac
          done < files.txt
          if [ "$BASE" = master ]; then
            level=high; reasons="- 운영 배포(\`$HEAD\` → \`master\`)"$'\n'"$reasons"
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"
          { echo "reasons<<__END__"; printf '%s' "$reasons" | head -20; echo "__END__"; } >> "$GITHUB_OUTPUT"
          echo "위험도: $level"; printf '%s' "$reasons"

      - name: 위험도 라벨
        continue-on-error: true   # 포크 PR처럼 쓰기 권한이 없으면 라벨만 건너뛴다
        env:
          LEVEL: ${{ steps.risk.outputs.level }}
        run: |
          gh label create "위험도: 높음" --repo "$REPO" --color d73a4a --description "사람 1명 승인 필요" --force >/dev/null
          gh label create "위험도: 중간" --repo "$REPO" --color fbca04 --description "AI 리뷰 통과 시 자동 병합" --force >/dev/null
          gh label create "위험도: 낮음" --repo "$REPO" --color 0e8a16 --description "CI 통과 시 자동 병합" --force >/dev/null
          case "$LEVEL" in high) want="위험도: 높음" ;; medium) want="위험도: 중간" ;; *) want="위험도: 낮음" ;; esac
          for l in "위험도: 높음" "위험도: 중간" "위험도: 낮음"; do
            [ "$l" = "$want" ] && continue
            gh pr edit "$PR" --repo "$REPO" --remove-label "$l" >/dev/null 2>&1 || true
          done
          gh pr edit "$PR" --repo "$REPO" --add-label "$want" >/dev/null

      # 중간 위험도: 커밋마다 한 번 AI 리뷰를 하고 결과를 PR 댓글에 남긴다(같은 커밋은 댓글의 결과를 다시 쓴다)
      - name: AI 리뷰 결과 찾기
        id: prior
        if: steps.risk.outputs.level == 'medium'
        run: |
          body=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '[.[] | select(.body | contains("<!-- ai-review -->"))] | last | .body // ""')
          if printf '%s' "$body" | grep -q "<!-- ai-review-sha: $HEAD_SHA -->"; then
            verdict=$(printf '%s' "$body" | grep -o '<!-- ai-review-verdict: [a-z]* -->' | grep -o 'pass\|block')
            echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
            echo "이 커밋은 이미 리뷰했어요: $verdict"
          fi

      - uses: actions/checkout@v4
        if: steps.risk.outputs.level == 'medium' && steps.prior.outputs.verdict == ''
        with:
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@v4
        if: steps.risk.outputs.level == 'medium' && steps.prior.outputs.verdict == ''
        with:
          node-version: 24

      - name: AI 리뷰 (Claude)
        id: ai
        if: steps.risk.outputs.level == 'medium' && steps.prior.outputs.verdict == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          gh pr diff "$PR" --repo "$REPO" > pr.diff
          mkdir -p /tmp/ai && (cd /tmp/ai && npm init -y >/dev/null && npm install --silent @anthropic-ai/sdk >/dev/null)
          cp .github/scripts/ai-review.mjs /tmp/ai/ai-review.mjs
          node /tmp/ai/ai-review.mjs pr.diff review.json
          verdict=$(jq -r .verdict review.json)
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo "<!-- ai-review -->"
            echo "<!-- ai-review-sha: $HEAD_SHA -->"
            echo "<!-- ai-review-verdict: $verdict -->"
            if [ "$verdict" = pass ]; then echo "### 🤖 AI 리뷰: 통과"; else echo "### 🤖 AI 리뷰: 사람 확인 필요"; fi
            echo
            jq -r .summary review.json
            echo
            jq -r '.findings[] | "- " + (if .severity == "blocking" then "🔴 **꼭 고치기**" else "💡 제안" end) + " `" + .file + ":" + (.line|tostring) + "` **" + .title + "**: " + .detail' review.json
            echo
            echo "<sub>커밋 \`${HEAD_SHA:0:7}\` 기준 · 통과하면 CI 통과 후 자동 병합, 아니면 고치거나 팀원이 승인하면 병합돼요.</sub>"
          } > comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file comment.md >/dev/null || echo "::warning::리뷰 댓글을 남기지 못했어요" 

      - name: 병합 조건 확인
        id: gate
        env:
          LEVEL: ${{ steps.risk.outputs.level }}
          REASONS: ${{ steps.risk.outputs.reasons }}
          AI: ${{ steps.ai.outputs.verdict || steps.prior.outputs.verdict }}
        run: |
          # 사람별 마지막 리뷰가 승인이고, 작성자가 아닌 사람 수
          approvals=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --jq '.[] | select(.state != "COMMENTED") | [.user.login, .state] | @tsv' \
            | awk -F'\t' -v a="$AUTHOR" '$1 != a { last[$1] = $2 } END { n = 0; for (u in last) if (last[u] == "APPROVED") n++; print n }')
          ok=false; why=""
          if [ "$BASE" = master ]; then
            if [ "$HEAD" = dev ]; then ok=true; why="dev → master 운영 배포 PR이에요. 병합은 관리자(찬웅님)만 할 수 있어요."
            else why="master에는 dev에서 오는 PR만 받아요. 작업 브랜치는 dev로 PR을 올려 주세요."; fi
          else
            case "$LEVEL" in
              low) ok=true; why="낮은 위험도라 CI가 통과하면 자동 병합돼요." ;;
              medium)
                if [ "$AI" = pass ]; then ok=true; why="AI 리뷰를 통과해서 CI가 통과하면 자동 병합돼요."
                elif [ "$approvals" -ge 1 ]; then ok=true; why="AI가 확인을 요청했지만 팀원 승인이 있어 병합할 수 있어요."
                else why="AI 리뷰가 확인을 요청했어요. 지적을 고치거나 팀원 1명이 승인하면 병합돼요."; fi ;;
              high)
                if [ "$approvals" -ge 1 ]; then ok=true; why="팀원 승인 ${approvals}명이 있어 병합할 수 있어요."
                else why="높은 위험도라 작성자가 아닌 팀원 1명의 승인이 필요해요."; fi ;;
            esac
          fi
          {
            echo "## PR 위험도: $LEVEL"
            echo; echo "$why"; echo
            echo "**판정 이유**"; echo "${REASONS:-- 문서, 데이터, 테스트만 바뀜}"
            echo; echo "승인: ${approvals}명 · AI 리뷰: ${AI:-해당 없음}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "$why"
          [ "$ok" = true ] || exit 1

      # 낮음, 중간은 조건을 채우면 자동 병합을 켠다(CI 등 필수 검사가 모두 통과하는 순간 GitHub이 병합)
      - name: 자동 병합 켜기
        if: steps.gate.outputs.ok == 'true' && env.BASE == 'dev' && (steps.risk.outputs.level == 'low' || steps.risk.outputs.level == 'medium')
        run: |
          gh pr merge "$PR" --repo "$REPO" --auto --merge \
            || echo "::warning::자동 병합을 켜지 못했어요. 저장소 Settings에서 'Allow auto-merge'를 켰는지 확인해 주세요."
