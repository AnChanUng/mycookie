# PR 위험도 검사: 바뀐 파일로 위험도를 정하고, 위험도에 맞는 조건을 채웠는지 확인한다.
#   🟢 낮음  문서, 문제 데이터, 테스트만        → CI 통과하면 자동 병합
#   🟡 중간  그 외 백엔드, 화면 코드            → 저장소 주인(찬웅)이 올린 PR은 CI 통과하면 dev까지 자동 병합,
#                                                 다른 사람이 올린 PR은 저장소 주인의 승인 필요
#   🔴 높음  보안, 결제, 기존 DB 엔티티 변경,    → 저장소 주인(찬웅)이 올린 PR은 CI 통과하면 dev까지 자동 병합("사후 리뷰" 라벨),
#                                                 다른 사람이 올린 PR은 작성자가 아닌 사람 1명 승인
#           설정, 배포,                           (새 엔티티 추가는 중간)
#           CI, 의존성
#   운영    dev → master                         → 브랜치 규칙상 관리자만 병합
# 이 잡("위험도 검사")을 dev, master 브랜치 규칙의 필수 검사로 둔다(.github/rulesets/).
# 승인, 승인 취소가 생기면 다시 돌아 결과를 갱신한다.
name: PR 위험도

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: write        # 자동 병합
  pull-requests: write   # 라벨, 자동 병합
  issues: write          # 라벨 만들기

concurrency:
  group: pr-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk:
    name: 위험도 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref }}
      HEAD: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: 위험도 분류
        id: risk
        run: |
          # 파일마다 상태(added, modified, removed, renamed)와 경로를 받는다
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | "\(.status)\t\(.filename)"' > files.txt
          level=low; reasons=""
          bump() { # $1=level $2=이유
            case "$1" in high) level=high ;; medium) [ "$level" = low ] && level=medium ;; esac
            reasons="${reasons}- $2"$'\n'
          }
          while IFS=$'\t' read -r st f; do
            case "$f" in
              backend/src/main/java/*/security/*|*Auth*.java|*OAuth*.java|*Password*.java|*Payment*.java|*Toss*.java|*Credential*.java|*CsChannel*.java|*RoleService.java)
                bump high "\`$f\` 로그인, 보안, 결제" ;;
              backend/src/main/java/*/entity/*)
                # 새 엔티티는 새 표만 생기고 기존 데이터를 건드리지 않아 중간. 기존 엔티티를 고치거나 지우면 높음
                if [ "$st" = added ]; then bump medium "\`$f\` 새 DB 엔티티(새 표만 생김)"
                else bump high "\`$f\` 기존 DB 엔티티 변경(스키마가 자동으로 바뀜)"; fi ;;
              backend/src/main/resources/application*.yml|backend/build.gradle.kts|backend/Dockerfile|backend/entrypoint.sh)
                bump high "\`$f\` 백엔드 설정, 의존성, 이미지" ;;
              deploy/*|docker-compose.yml|frontend/Dockerfile|frontend/nginx/*|frontend/vercel.json|render.yaml)
                bump high "\`$f\` 배포, 서버 설정" ;;
              .github/*)
                bump high "\`$f\` CI, 저장소 규칙" ;;
              frontend/package-lock.json)
                bump high "\`$f\` 화면 의존성" ;;
              frontend/package.json)
                # 라이브러리(dependencies)가 바뀌면 높음, 검사, 빌드 명령(scripts)만 바뀌면 중간
                changed=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | select(.filename == "frontend/package.json") | .patch' \
                  | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)
                if printf '%s\n' "$changed" | grep -vE '^[+-][[:space:]]*"[a-z][a-z0-9:-]*":[[:space:]]*"(node|npm|vite|eslint|npx) [^"]*",?[[:space:]]*$' | grep -q .; then
                  bump high "\`$f\` 화면 의존성"
                else
                  bump medium "\`$f\` 검사, 빌드 명령(scripts)만"
                fi ;;
              *.md|docs/*|content/*|frontend/src/data/*|backend/src/main/resources/content/*|backend/src/main/resources/*-bank.json|backend/src/main/resources/newsletter/*|backend/src/test/*|frontend/public/*)
                ;;  # 낮음
              *)
                bump medium "\`$f\` 코드" ;;
            esac
          done < files.txt
          if [ "$BASE" = master ]; then
            level=high; reasons="- 운영 배포(\`$HEAD\` → \`master\`)"$'\n'"$reasons"
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"
          { echo "reasons<<__END__"; printf '%s' "$reasons" | head -20; echo "__END__"; } >> "$GITHUB_OUTPUT"
          echo "위험도: $level"; printf '%s' "$reasons"

      - name: 위험도 라벨
        continue-on-error: true   # 포크 PR처럼 쓰기 권한이 없으면 라벨만 건너뛴다
        env:
          LEVEL: ${{ steps.risk.outputs.level }}
        run: |
          gh label create "위험도: 높음" --repo "$REPO" --color d73a4a --description "사람 1명 승인 필요" --force >/dev/null
          gh label create "위험도: 중간" --repo "$REPO" --color fbca04 --description "저장소 주인 승인 필요(주인이 올리면 바로 병합 가능)" --force >/dev/null
          gh label create "위험도: 낮음" --repo "$REPO" --color 0e8a16 --description "CI 통과 시 자동 병합" --force >/dev/null
          case "$LEVEL" in high) want="위험도: 높음" ;; medium) want="위험도: 중간" ;; *) want="위험도: 낮음" ;; esac
          for l in "위험도: 높음" "위험도: 중간" "위험도: 낮음"; do
            [ "$l" = "$want" ] && continue
            gh pr edit "$PR" --repo "$REPO" --remove-label "$l" >/dev/null 2>&1 || true
          done
          gh pr edit "$PR" --repo "$REPO" --add-label "$want" >/dev/null

      - name: 병합 조건 확인
        id: gate
        env:
          LEVEL: ${{ steps.risk.outputs.level }}
          REASONS: ${{ steps.risk.outputs.reasons }}
        run: |
          # 사람별 마지막 리뷰(댓글만 단 리뷰는 빼고)가 승인인 사람 목록. 작성자 자신은 뺀다
          approvers=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --jq '.[] | select(.state != "COMMENTED") | [.user.login, .state] | @tsv' \
            | awk -F'\t' -v a="$AUTHOR" '$1 != a { last[$1] = $2 } END { for (u in last) if (last[u] == "APPROVED") print u }')
          approvals=$(printf '%s' "$approvers" | grep -c . || true)
          owner_ok=false; printf '%s\n' "$approvers" | grep -qx "$OWNER" && owner_ok=true
          ok=false; why=""
          if [ "$BASE" = master ]; then
            if [ "$HEAD" = dev ]; then ok=true; why="dev → master 운영 배포 PR이에요. 병합은 관리자($OWNER)만 할 수 있어요."
            else why="master에는 dev에서 오는 PR만 받아요. 작업 브랜치는 dev로 PR을 올려 주세요."; fi
          else
            case "$LEVEL" in
              low) ok=true; why="낮은 위험도라 CI가 통과하면 자동 병합돼요." ;;
              medium)
                if [ "$AUTHOR" = "$OWNER" ]; then ok=true; why="저장소 주인이 올린 중간 위험도 PR이라 CI가 통과하면 dev로 자동 병합돼요."
                elif [ "$owner_ok" = true ]; then ok=true; why="$OWNER 님이 승인해서 병합할 수 있어요."
                else why="중간 위험도라 $OWNER 님의 승인이 필요해요."; fi ;;
              high)
                # dev는 스테이징이고 운영(master) 병합은 관리자만 하므로, 주인의 PR은 CI를 믿고 먼저 병합한 뒤 팀원이 읽고 질문한다
                if [ "$AUTHOR" = "$OWNER" ]; then ok=true; why="저장소 주인이 올린 높은 위험도 PR이라 CI가 통과하면 dev로 자동 병합돼요. 병합 뒤 팀원이 읽어 보는 '사후 리뷰' 대상이에요."
                elif [ "$approvals" -ge 1 ]; then ok=true; why="작성자가 아닌 승인 ${approvals}명이 있어 병합할 수 있어요."
                else why="높은 위험도라 작성자가 아닌 사람 1명의 승인이 반드시 필요해요."; fi ;;
            esac
          fi
          {
            echo "## PR 위험도: $LEVEL"
            echo; echo "$why"; echo
            echo "**판정 이유**"; echo "${REASONS:-- 문서, 데이터, 테스트만 바뀜}"
            echo; echo "승인한 사람: ${approvers:-없음}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "$why"
          [ "$ok" = true ] || exit 1

      # 높은 위험도인 주인 PR에는 "사후 리뷰" 라벨을 붙여, 병합 뒤 팀원이 읽고 [질문]을 남기게 한다
      - name: 사후 리뷰 라벨
        if: steps.gate.outputs.ok == 'true' && env.BASE == 'dev' && steps.risk.outputs.level == 'high' && env.AUTHOR == env.OWNER
        continue-on-error: true
        run: |
          gh label create "사후 리뷰" --repo "$REPO" --color 5319e7 --description "병합 뒤 팀원이 읽고 질문하기" --force >/dev/null
          gh pr edit "$PR" --repo "$REPO" --add-label "사후 리뷰" >/dev/null

      # 낮음, 그리고 저장소 주인이 올린 PR(중간, 높음)은 자동 병합을 켠다(CI 등 필수 검사가 모두 통과하는 순간 GitHub이 병합).
      # 작업 브랜치 → dev는 커밋을 하나로 합친다(squash). 다른 사람의 중간, 높음과 master는 사람이 병합 버튼을 누른다
      - name: 자동 병합 켜기
        if: >-
          steps.gate.outputs.ok == 'true' && env.BASE == 'dev' &&
          (steps.risk.outputs.level == 'low' || env.AUTHOR == env.OWNER)
        run: |
          gh pr merge "$PR" --repo "$REPO" --auto --squash \
            || echo "::warning::자동 병합을 켜지 못했어요. 저장소 Settings에서 'Allow auto-merge'를 켰는지 확인해 주세요."
