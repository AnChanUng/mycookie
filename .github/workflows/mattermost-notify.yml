# 할 일이 생기는 개발 소식만 Mattermost 채널로 보낸다(오늘의 CS와 같은 수신 웹훅을 쓴다).
#   - 이슈: 새로 열렸을 때 (사이트 제보로 만든 이슈는 백엔드가 이미 알리므로 건너뛴다)
#   - PR: 열렸을 때(리뷰 요청)
#   - CI: 실패했을 때만
#   PR 병합, 이슈 닫힘처럼 이미 끝난 일은 알리지 않는다(GitHub에 기록이 남는다)
#   - 수동 실행(workflow_dispatch): 연결 시험(PoC) 메시지
# 저장소 Settings → Secrets and variables → Actions에 MATTERMOST_WEBHOOK_URL이 있어야 보낸다. 없으면 조용히 건너뛴다.
# 제목 같은 사용자 입력은 스크립트에 직접 넣지 않고 환경변수로 넘겨 jq로 JSON을 만든다(명령 주입 방지)
name: Mattermost 알림

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # CI는 실패했을 때만 알린다
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: 메시지 만들기
        id: msg
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          # 멘션(@channel 등)이 실제로 울리지 않게 @ 뒤에 보이지 않는 문자를 끼운다
          quiet() { printf '%s' "$1" | sed 's/@/@\xe2\x80\x8b/g'; }
          text=""
          case "$EVENT" in
            issues)
              if printf '%s' "$ISSUE_BODY" | grep -q '건의 · 제보 양식으로 접수된 이슈'; then
                echo "사이트 제보 이슈는 백엔드가 이미 알렸으므로 건너뜁니다"
              else
                text="#### :memo: 새 이슈 [#${ISSUE_NUMBER}](${ISSUE_URL})"$'\n'"**$(quiet "$ISSUE_TITLE")**"
                [ -n "$ISSUE_LABELS" ] && text="${text}  \`${ISSUE_LABELS}\`"
                text="${text}"$'\n'"작성: ${ACTOR}"
              fi ;;
            pull_request)
              text="#### :eyes: 리뷰 요청 PR [#${PR_NUMBER}](${PR_URL})"$'\n'"**$(quiet "$PR_TITLE")**"$'\n'"\`${PR_HEAD}\` → \`${PR_BASE}\` · 작성: ${ACTOR}" ;;
            workflow_run)
              text="#### :rotating_light: CI 실패"$'\n'"\`${RUN_BRANCH}\` · $(quiet "$RUN_TITLE") · ${RUN_ACTOR}"$'\n'"[실패한 검사 보기](${RUN_URL})" ;;
            workflow_dispatch)
              text="#### :white_check_mark: GitHub → Mattermost 연결 시험"$'\n'"${REPO} 저장소의 GitHub Actions에서 보낸 메시지예요. 이게 보이면 이슈, PR, CI 알림을 받을 수 있어요." ;;
          esac
          {
            echo "text<<__END__"
            printf '%s\n' "$text"
            echo "__END__"
          } >> "$GITHUB_OUTPUT"

      - name: Mattermost로 보내기
        if: steps.msg.outputs.text != ''
        env:
          WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          TEXT: ${{ steps.msg.outputs.text }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::MATTERMOST_WEBHOOK_URL 시크릿이 없어 보내지 않았습니다"
            exit 0
          fi
          jq -n --arg text "$TEXT" '{username: "GitHub", text: $text}' |
            curl -sS --fail-with-body --max-time 20 -H 'Content-Type: application/json' -d @- "$WEBHOOK"
