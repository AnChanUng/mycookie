services:
  - type: web
    name: cs-study-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: SLACK_ENABLED
        value: "false"
      - key: APP_BASE_URL
        value: https://cs-study-frontend-dg8c.onrender.com
      # Neon Postgres connection string (free tier, no expiry). Set in the Render
      # dashboard; Render's own free Postgres is deleted after 90 days.
      - key: DATABASE_URL
        sync: false
      # 관리자 페이지(/admin/cu) 접속 키. Render 대시보드에서 직접 설정한다
      - key: ADMIN_KEY
        sync: false

  # 스테이징 백엔드: dev 브랜치를 배포한다. DB는 운영과 분리된 Neon 스테이징 브랜치를 쓴다(docs/staging.md).
  # 깨우지 않으므로 15분 동안 요청이 없으면 잠든다(무료 사용 시간 절약).
  - type: web
    name: cs-study-backend-staging
    runtime: docker
    rootDir: backend
    branch: dev
    plan: free
    envVars:
      - key: SLACK_ENABLED
        value: "false"
      - key: APP_BASE_URL
        value: https://cs-study-platform.vercel.app
      # Neon 스테이징 브랜치 연결 문자열. 운영 DATABASE_URL을 넣지 않는다
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        sync: false

  - type: web
    name: cs-study-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://cs-study-backend-i0ln.onrender.com/api/v1
